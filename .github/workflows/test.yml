name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwayland-dev libwayland-bin python3 python3-gi python3-cairo gir1.2-gtk-3.0
      - name: Build and test
        run: make test
